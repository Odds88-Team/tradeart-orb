description: >
  Updates applicatrion image tag in ArgoCD dev repository.

parameters:
  repository_name:
    description: Name of the image repository.
    type: string
  argo_service_names:
    description: Names of the applications in ArgoCD repository, separated by coma.
    type: string
  argo_env_name:
    description: Environment in ArgoCD repository.
    type: string
  deployment_type:
    description: Type of the deployment, can be global or tenanted.
    type: enum
    enum: ["global", "tenanted"]
    default: "global"
  push_max_attempts:
    description: >
      How many times to push the image tag change before failing. A push rejected because another
      pipeline updated the ArgoCD repository first is retried on the new remote head.
    type: integer
    default: 3

steps:
  - run:
      name: "Clonning ArgoCD repository"
      command: |
        mkdir -p ~/.ssh
        ssh-keyscan github.com >> ~/.ssh/known_hosts
        echo '-----BEGIN OPENSSH PRIVATE KEY-----' > ~/.ssh/id_rsa_1
        echo $DEV_CLUSTER_REPO_KEY >> ~/.ssh/id_rsa_1
        echo '-----END OPENSSH PRIVATE KEY-----' >> ~/.ssh/id_rsa_1
        ssh-add -D
        chmod 600 ~/.ssh/id_rsa_1
        rm -rf tradeart-tenants
        GIT_SSH_COMMAND="ssh -i ~/.ssh/id_rsa_1" git clone git@github.com:Odds88-Team/tradeart-tenants.git
  - run:
      name: "Updating Image Tag"
      environment:
        PARAM_ARGO_REPO_DIR: tradeart-tenants
        PARAM_ARGO_SERVICE_NAMES: "<<parameters.argo_service_names>>"
        PARAM_IMAGE_REPOSITORY: "<<parameters.repository_name>>"
        PARAM_DEPLOYMENT_TYPE: "<<parameters.deployment_type>>"
        PARAM_DEPLOY_TARGET: "<<parameters.argo_env_name>>"
        PARAM_GLOBAL_MANIFEST_PATH: "argocd/services/overlays/<<parameters.argo_env_name>>/{service}/version.yaml"
        PARAM_TENANTED_MANIFEST_PATH: "argocd/base/<<parameters.argo_env_name>>/{service}/deployment.yaml"
        PARAM_PUSH_MAX_ATTEMPTS: "<<parameters.push_max_attempts>>"
      command: <<include(scripts/update_argo_image.sh)>>
