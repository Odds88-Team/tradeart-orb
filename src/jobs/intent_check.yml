description: >
  Check Intent Architect project.

executor:
  name: default
  tag: "10.0"
  resource_class: <<parameters.executor_class>>

parameters:
  path_to_intent:
    description: Path to the Intent Architect solution (.isln) file or folder containing a single .isln file.
    type: string
    default: 'intent'
  application_id:
    description: The Id of the Intent Architect application. If unspecified then all applications found in the .isln will be run.
    type: string
    default: ''
  intent_version:
    description: Version of intent check tool required for the run.
    type: string
    default: '4.4.5'
  intent_solution:
    description: >
      Path to the Intent Architect solution (.isln) file to run SDD verification (intent-cli verify-sdd) against
      after the Software Factory check. SDD verification is skipped when unspecified.
      Requires an intent_version that supports verify-sdd.
    type: string
    default: ''
  executor_class:
    default: 'medium'
    type: string

steps:
  - checkout
  - install_intent_cli:
      intent_version: <<parameters.intent_version>>
  - intent_check_staged:
      path_to_intent: <<parameters.path_to_intent>>
      application_id: <<parameters.application_id>>
  - when:
      condition: <<parameters.intent_solution>>
      steps:
        - intent_verify_sdd:
            intent_solution: <<parameters.intent_solution>>
  - inject_slack_templates
  - slack/notify:
      event: fail
      template: BUILD_FAILED_TEMPLATE
      channel: odds88-circleci-notifications
